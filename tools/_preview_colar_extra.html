<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html,body { margin:0; background:#15161a; font:12px monospace; color:#ddd; }
  #grade { display:flex; flex-wrap:wrap; gap:6px; padding:8px; }
  .cel { width:360px; }
  .rot { padding:2px 0; color:#9fe; }
  img { width:360px; height:360px; object-fit:cover; background:#202228; border:1px solid #3a3d45; }
</style>
<script type="importmap">
{ "imports": { "three": "../node_modules/three/build/three.module.js" } }
</script>
</head>
<body>
<div id="grade"></div>
<script type="module">
import * as THREE from 'three'
import { COLARES_EXTRA } from '../src/player/roupa/colares-extra.js'

// Perfis reais (copiados de character.js) so pra dar ESCALA de referencia —
// nao e o corpo do jogo (character.js esta fora do alcance desta tarefa).
const CHEST_PROFILE = [
  [0.130, 0.000], [0.141, 0.046], [0.146, 0.092], [0.144, 0.126],
  [0.136, 0.152], [0.121, 0.174], [0.101, 0.191], [0.084, 0.200], [0.074, 0.205],
]
function mockCtx() {
  return {
    perfil: { PELVIS: [[0.13, 0]], PEITO: CHEST_PROFILE },
    medida: {
      HIPS_Y: 0.84, CHEST_Y: 0.30, NECK_Y: 0.165, SHOULDER_X: 0.124, SHOULDER_Y: 0.120,
      UPPER_ARM: 0.28, FORE_ARM: 0.26, FLAT_Z: 0.76, TORSO_SEG: 24,
    },
  }
}

const W = 360, H = 360
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setSize(W, H)

function corpoRef(c) {
  const g = new THREE.Group()
  const mat = new THREE.MeshStandardMaterial({ color: 0xc79a73, roughness: 0.85 })
  const pts = CHEST_PROFILE.map((p) => new THREE.Vector2(p[0] * 0.965, p[1]))
  const geo = new THREE.LatheGeometry(pts, 24)
  geo.scale(1, 1, c.medida.FLAT_Z)
  geo.computeVertexNormals()
  g.add(new THREE.Mesh(geo, mat))
  const neckGeo = new THREE.CylinderGeometry(0.050, 0.060, c.medida.NECK_Y + 0.01, 20, 1, true)
  const neck = new THREE.Mesh(neckGeo, mat)
  neck.position.y = c.medida.NECK_Y / 2
  g.add(neck)
  return g
}

function cenaBase() {
  const scene = new THREE.Scene()
  scene.background = new THREE.Color(0x202228)
  scene.add(new THREE.HemisphereLight(0xffffff, 0x30302a, 1.15))
  const sol = new THREE.DirectionalLight(0xfff2df, 2.3)
  sol.position.set(2, 3, 4)
  scene.add(sol)
  const sol2 = new THREE.DirectionalLight(0x8fb0ff, 0.55)
  sol2.position.set(-3, 1, -2)
  scene.add(sol2)
  return scene
}

const camera = new THREE.PerspectiveCamera(30, W / H, 0.02, 10)
camera.position.set(0.06, 0.10, 0.46)
camera.lookAt(0, 0.00, 0.02)

const grade = document.getElementById('grade')
for (const item of COLARES_EXTRA) {
  const scene = cenaBase()
  const c = mockCtx()
  scene.add(corpoRef(c))
  scene.add(item.build(c))
  renderer.render(scene, camera)

  const cel = document.createElement('div')
  cel.className = 'cel'
  const rot = document.createElement('div')
  rot.className = 'rot'
  rot.textContent = item.id + '  (' + item.nome + ')'
  const im = document.createElement('img')
  im.src = renderer.domElement.toDataURL('image/png')
  cel.appendChild(rot); cel.appendChild(im)
  grade.appendChild(cel)
}

window.__pronto = true
</script>
</body>
</html>

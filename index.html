<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Mini City RP</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0d12; }
  body { font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color:#fff; }
  #app { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
</style>
</head>
<body>
  <div id="app"></div>
  <!-- PeerJS: SO A SINALIZACAO do chat de voz (src/rede/voz.js). O audio em si
       e WebRTC direto entre os jogadores e nao encosta em servidor nenhum.

       `defer` porque nada no carregamento depende disto: o `window.Peer` so e
       lido quando alguem aperta V pra abrir o microfone, muito depois da pagina
       montar. Sem `defer`, uma ida lenta ao unpkg atrasaria o jogo inteiro.

       ATENCAO PRO EMPACOTAMENTO: isto e um pedido de rede a cada carregamento.
       Pra build offline (Steam), trocar por `npm i peerjs@1.5.2` e
       `import Peer from 'peerjs'` dentro de voz.js — a API e a mesma, e o Vite
       passa a embutir a biblioteca no bundle. -->
  <script defer src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
